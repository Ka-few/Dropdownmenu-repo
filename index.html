<!DOCTYPE html>
<html lang="en">
<head>
    <title>Drop down menu</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="hero">

        <div class="selector">
            <div id="selectorField">
                <p id="selectorText">Select Social Media</p>
                <img src="icons/arrow.png" id="arrowIcon">
            </div>
            <ul id="list" class="hide">
                <li class="options">
                    <img src="icons/facebook.png">
                    <p>Facebook</p>
                </li>
                <li class="options">
                    <img src="icons/instagram.png">
                    <p>Instagram</p>
                </li>
                <li class="options">
                    <img src="icons/youtube.png">
                    <p>Youtube</p>
                </li>
                <li class="options">
                    <img src="icons/twitter.png">
                    <p>X</p>
                </li>
                <li class="options">
                    <img src="icons/tiktok.png">
                    <p>TikTok</p>
                </li>
            </ul>
        </div>
    </div>
    <script>
        var selectorField = document.getElementById("selectorField");
        var selectorText = document.getElementById("selectorText");
        var options = document.getElementsByClassName("options");
        var list = document.getElementById("list");
        var arrowIcon = document.getElementById("arrowIcon");

        selectorField.onclick = function(){
            list.classList.toggle("hide");
            arrowIcon.classList.toggle("rotate");
        }


        for(option of options){
            option.onclick = function(){
                selectorText.innerHTML = this.textContent;
                list.classList.toggle("hide");
                arrowIcon.classList.toggle("rotate");
            }
        }

    </script>
</body>
</html>
